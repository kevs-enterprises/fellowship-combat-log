# Self-contained CI. Sibling repositories call the shared workflow in
# a shared workflow repository instead, and this one tried to; that call failed at
# startup with zero jobs, which is how GitHub reports a reusable workflow it
# cannot resolve for the calling repository — a startup failure cancels the whole
# run, so even the unrelated wasm32 job never began. The workflow file itself
# parses, and the same call succeeds from another repository, so what differs is
# this repository's access to it rather than the callee.
#
# To adopt the shared workflow later, grant this repository access to the org
# `.github` repository's Actions (Settings -> Actions -> Access), then replace the
# three jobs below with `uses: a shared workflow repository/.github/workflows/ci.yml@main`.
# Keep the wasm32 job either way — the shared workflow builds for the host target
# only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # This crate's whole reason for being dependency-free is that it also compiles
  # to wasm32, so that promise needs a check rather than a convention: a
  # native-only dependency or a stray `std::fs` would otherwise only surface in a
  # browser consumer.
  wasm32:
    name: wasm32 build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Add the wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - run: cargo build --lib --target wasm32-unknown-unknown

  # One stable context meaning "the whole verification graph passed", which is what
  # a branch-protection ruleset should match, so adding a job later does not mean
  # re-pointing branch protection. Renaming this job detaches protection silently,
  # because the ruleset matches the job id.
  combat-log-gate:
    needs: [rust, wasm32]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Assert the verification graph succeeded
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          WASM_RESULT: ${{ needs.wasm32.result }}
        run: |
          set -euo pipefail
          failed=0
          if [ "$RUST_RESULT" != "success" ]; then
            printf 'the rust lane concluded %s\n' "$RUST_RESULT" >&2
            failed=1
          fi
          if [ "$WASM_RESULT" != "success" ]; then
            printf 'the wasm32 build concluded %s\n' "$WASM_RESULT" >&2
            failed=1
          fi
          test "$failed" -eq 0
          printf 'rust and wasm32 succeeded\n'
