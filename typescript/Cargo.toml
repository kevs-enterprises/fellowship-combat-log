[package]
name = "fellowship-combat-log-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "wasm-bindgen bindings for fellowship-combat-log, packaged as a TypeScript/JS npm module."
repository = "https://github.com/kevs-enterprises/fellowship-combat-log"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fellowship-combat-log = { path = "../rust" }
js-sys = "0.3.103"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.126"

# `wasm-opt` (binaryen) fetches a prebuilt binary from a GitHub release at build
# time; skip that extra network dependency and toolchain fetch and rely on
# rustc's own release-profile optimizations, which are enough for a small,
# dependency-free crate like this one.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
