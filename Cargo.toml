[package]
name = "fellowship-combat-log"
version.workspace = true
edition.workspace = true

# Deliberately dependency-free. The four modules here decode log text into typed
# events and nothing else, so they need no serde — that is the seam this crate
# exists to hold. Emitting JSON is the extract pipeline's job and stays in
# `the pipeline crate`; adding a dependency here would erode the boundary that makes
# this crate reusable outside the Fellowship Tools original repository.
[dependencies]
